<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algorithm — Pyramid Preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #F4F3EF;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 24px 80px;
  }

  .head { text-align: center; margin-bottom: 56px; }
  .eyebrow {
    font-size: 10px; font-weight: 700; letter-spacing: .28em; text-transform: uppercase;
    color: #4ade80; margin-bottom: 12px;
  }
  h2 {
    font-size: clamp(1.8rem, 3.5vw, 2.6rem); font-weight: 800;
    color: #0d1a10; line-height: 1.08;
  }
  h2 em { font-style: italic; font-weight: 400; color: rgba(13,26,16,.28); }

  .pyramid {
    display: flex; flex-direction: column; align-items: center;
    gap: 0; width: 100%; max-width: 780px;
  }

  .row { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; width: 100%; }

  /* ── Cube ── */
  .cube {
    background: #fff;
    border: 1.5px solid rgba(74,222,128,.3);
    border-radius: 10px;
    padding: 9px 16px;
    font-size: 12px; font-weight: 600; color: #0d1a10;
    white-space: nowrap;
    box-shadow: 0 0 0 3px rgba(74,222,128,.08), 0 2px 8px rgba(74,222,128,.08);
    transition: border-color .2s, box-shadow .2s, transform .15s;
    cursor: default;
  }
  .cube:hover {
    border-color: rgba(74,222,128,.6);
    box-shadow: 0 0 0 4px rgba(74,222,128,.14), 0 2px 14px rgba(74,222,128,.15);
    transform: translateY(-2px);
  }
  .cube.input-cube { font-size: 13px; font-weight: 700; padding: 12px 28px; }
  .cube.solo       { padding: 10px 28px; font-weight: 700; }
  .cube.output {
    font-size: 13px; font-weight: 700; padding: 12px 32px;
    background: linear-gradient(135deg, rgba(74,222,128,.1) 0%, rgba(74,222,128,.03) 100%);
    border-color: rgba(74,222,128,.45);
    animation: output-pulse 3s ease-in-out infinite;
  }
  @keyframes output-pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(74,222,128,.08), 0 4px 20px rgba(74,222,128,.12); }
    50%       { box-shadow: 0 0 0 7px rgba(74,222,128,.15), 0 4px 36px rgba(74,222,128,.26); }
  }

  /* ── Vertical pipe ── */
  /* Grid row so 5 filter cubes align with manifold SVG endpoints */
  .filter-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    width: 560px;
    max-width: 100%;
    place-items: center;
    gap: 0;
  }
  /* Manifold SVG */
  .fan-svg {
    display: block;
    width: 560px;
    max-width: 100%;
    height: 110px;
    margin-top: -10px;
    margin-bottom: -10px;
    position: relative;
    z-index: 0;
    overflow: visible;
  }
  .connector {
    width: 3px; height: 40px; border-radius: 2px;
    background: linear-gradient(90deg,
      rgba(74,222,128,.3) 0%,
      rgba(74,222,128,.7) 40%,
      rgba(74,222,128,.85) 50%,
      rgba(74,222,128,.7) 60%,
      rgba(74,222,128,.25) 100%
    );
    box-shadow: 0 0 5px rgba(74,222,128,.18);
    margin-top: -6px; margin-bottom: -6px;
    position: relative; z-index: 0;
  }
  .cube { position: relative; z-index: 1; }

  /* ── Merge section ── */
  .merge-section { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 520px; }
  .merge-top     { display: flex; justify-content: center; gap: 110px; width: 100%; }
  .merge-col     { display: flex; flex-direction: column; align-items: center; }
  .merge-svg     { display: block; width: 500px; max-width: 100%; height: 70px; margin-bottom: -10px; overflow: visible; position: relative; z-index: 0; }

  /* ── Row label ── */
  .row-label {
    font-size: 8.5px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase;
    color: rgba(74,222,128,.6); margin-bottom: 10px; text-align: center;
  }
  .row-block { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>

<div class="head">
  <p class="eyebrow">How it works</p>
  <h2>Built in layers.<br><em>Each one adds up.</em></h2>
</div>

<div class="pyramid">

  <!-- Top: Ingredients + Your Profile -->
  <div class="merge-section">
    <div class="merge-top">
      <div class="merge-col">
        <div class="cube input-cube">Ingredients</div>
      </div>
      <div class="merge-col">
        <div class="cube input-cube">Your Profile</div>
      </div>
    </div>

    <svg class="merge-svg" viewBox="0 0 500 70" fill="none">
      <defs>
        <linearGradient id="gl" x1="120" y1="0" x2="250" y2="70" gradientUnits="userSpaceOnUse">
          <stop offset="0%"   stop-color="#4ade80" stop-opacity=".2"/>
          <stop offset="100%" stop-color="#4ade80" stop-opacity=".65"/>
        </linearGradient>
        <linearGradient id="gr" x1="380" y1="0" x2="250" y2="70" gradientUnits="userSpaceOnUse">
          <stop offset="0%"   stop-color="#4ade80" stop-opacity=".2"/>
          <stop offset="100%" stop-color="#4ade80" stop-opacity=".65"/>
        </linearGradient>
      </defs>
      <path d="M120,0 L120,34 Q120,80 158,80 L250,80" stroke="url(#gl)" stroke-width="3" fill="none" stroke-linecap="square" stroke-linejoin="round"/>
      <path d="M120,0 L120,34 Q120,80 158,80 L250,80" stroke="rgba(255,255,255,.4)" stroke-width="1" fill="none" stroke-linecap="square" stroke-linejoin="round"/>
      <path d="M380,0 L380,34 Q380,80 342,80 L250,80" stroke="url(#gr)" stroke-width="3" fill="none" stroke-linecap="square" stroke-linejoin="round"/>
      <path d="M380,0 L380,34 Q380,80 342,80 L250,80" stroke="rgba(255,255,255,.4)" stroke-width="1" fill="none" stroke-linecap="square" stroke-linejoin="round"/>
    </svg>

    <div class="cube solo">Calorie Engine</div>
  </div>

  <!-- Single trunk → split point → 5 curved branches, no overlap -->
  <svg class="fan-svg" viewBox="0 0 560 110" fill="none">
    <defs>
      <linearGradient id="gd1" x1="280" y1="38" x2="56"  y2="110" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#4ade80" stop-opacity=".65"/>
        <stop offset="100%" stop-color="#4ade80" stop-opacity=".2"/>
      </linearGradient>
      <linearGradient id="gd2" x1="280" y1="38" x2="168" y2="110" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#4ade80" stop-opacity=".65"/>
        <stop offset="100%" stop-color="#4ade80" stop-opacity=".2"/>
      </linearGradient>
      <linearGradient id="gd3" x1="280" y1="38" x2="280" y2="110" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#4ade80" stop-opacity=".65"/>
        <stop offset="100%" stop-color="#4ade80" stop-opacity=".2"/>
      </linearGradient>
      <linearGradient id="gd4" x1="280" y1="38" x2="392" y2="110" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#4ade80" stop-opacity=".65"/>
        <stop offset="100%" stop-color="#4ade80" stop-opacity=".2"/>
      </linearGradient>
      <linearGradient id="gd5" x1="280" y1="38" x2="504" y2="110" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#4ade80" stop-opacity=".65"/>
        <stop offset="100%" stop-color="#4ade80" stop-opacity=".2"/>
      </linearGradient>
    </defs>

    <!-- Single trunk (drawn once) -->
    <path d="M280,0 L280,38" stroke="rgba(74,222,128,.65)" stroke-width="3" fill="none" stroke-linecap="square"/>
    <path d="M280,0 L280,38" stroke="rgba(255,255,255,.4)"  stroke-width="1" fill="none" stroke-linecap="square"/>

    <!-- Branch → Allergy Filter -->
    <path d="M280,38 Q280,96 56,96 L56,110"  stroke="url(#gd1)" stroke-width="3" fill="none" stroke-linecap="square" stroke-linejoin="round"/>
    <path d="M280,38 Q280,96 56,96 L56,110"  stroke="rgba(255,255,255,.4)" stroke-width="1" fill="none" stroke-linecap="square" stroke-linejoin="round"/>

    <!-- Branch → Condition Filter -->
    <path d="M280,38 Q280,88 168,88 L168,110" stroke="url(#gd2)" stroke-width="3" fill="none" stroke-linecap="square" stroke-linejoin="round"/>
    <path d="M280,38 Q280,88 168,88 L168,110" stroke="rgba(255,255,255,.4)" stroke-width="1" fill="none" stroke-linecap="square" stroke-linejoin="round"/>

    <!-- Branch → Preference Filter (straight) -->
    <path d="M280,38 L280,110"               stroke="url(#gd3)" stroke-width="3" fill="none" stroke-linecap="square"/>
    <path d="M280,38 L280,110"               stroke="rgba(255,255,255,.4)" stroke-width="1" fill="none" stroke-linecap="square"/>

    <!-- Branch → Avoidance Filter -->
    <path d="M280,38 Q280,88 392,88 L392,110" stroke="url(#gd4)" stroke-width="3" fill="none" stroke-linecap="square" stroke-linejoin="round"/>
    <path d="M280,38 Q280,88 392,88 L392,110" stroke="rgba(255,255,255,.4)" stroke-width="1" fill="none" stroke-linecap="square" stroke-linejoin="round"/>

    <!-- Branch → Motivation Filter -->
    <path d="M280,38 Q280,96 504,96 L504,110" stroke="url(#gd5)" stroke-width="3" fill="none" stroke-linecap="square" stroke-linejoin="round"/>
    <path d="M280,38 Q280,96 504,96 L504,110" stroke="rgba(255,255,255,.4)" stroke-width="1" fill="none" stroke-linecap="square" stroke-linejoin="round"/>
  </svg>

  <div class="row-block">
    <div class="filter-row">
      <div class="cube">Allergy Filter</div>
      <div class="cube">Condition Filter</div>
      <div class="cube">Preference Filter</div>
      <div class="cube">Avoidance Filter</div>
      <div class="cube">Motivation Filter</div>
    </div>
  </div>

  <div style="display:flex;justify-content:center"><div class="connector"></div></div>

  <div class="row-block">
    <div class="row">
      <div class="cube">Main Dish</div>
      <div class="cube">Sides</div>
      <div class="cube">Dessert</div>
    </div>
  </div>

  <div style="display:flex;justify-content:center"><div class="connector"></div></div>

  <div class="row-block">
    <div class="row"><div class="cube solo">Duplication Control</div></div>
  </div>

  <div style="display:flex;justify-content:center"><div class="connector"></div></div>

  <div class="row-block">
    <div class="row"><div class="cube output">35-Day Meal Plan</div></div>
  </div>

</div>

</body>
</html>
